<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Item Value Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box button {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #764ba2;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background: #f9f9f9;
        }

        .suggestion-item {
            padding: 6px 12px;
            background: #e8e8f0;
            border: 1px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .suggestion-item:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .calculator-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .input-field {
            flex: 1;
            min-width: 150px;
        }

        .input-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }

        .input-field input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .input-field input:focus {
            outline: none;
            border-color: #667eea;
        }

        .calc-button {
            padding: 10px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .calc-button:hover {
            background: #764ba2;
        }

        .calc-button:active {
            transform: scale(0.98);
        }

        .results {
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .results.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: #333;
        }

        .result-value {
            color: #667eea;
            font-weight: bold;
            font-size: 16px;
        }

        .total-row {
            background: #f0f4ff;
            border-radius: 5px;
            margin-top: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
        }

        .total-label {
            font-weight: bold;
        }

        .total-value {
            color: #764ba2;
            font-weight: bold;
        }

        .error {
            color: #d32f2f;
            padding: 12px;
            background: #ffebee;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .category-btn {
            padding: 10px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .category-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .category-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }

        .tab-button {
            padding: 12px 20px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            color: #999;
            transition: all 0.3s;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .trading-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        .trade-side {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ddd;
            transition: border-color 0.3s;
        }

        .trade-side.offering {
            border-color: #ff6b6b;
        }

        .trade-side.receiving {
            border-color: #51cf66;
        }

        .trade-side h3 {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
        }

        .trade-side.offering h3 {
            color: #ff6b6b;
        }

        .trade-side.receiving h3 {
            color: #51cf66;
        }

        .trade-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .trade-item-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .trade-item-input {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .trade-item-input input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
        }

        .trade-item-input label {
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }

        .add-item-btn {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .add-item-btn:hover {
            background: #764ba2;
        }

        .trade-item-card {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trade-item-card.offering {
            border-left-color: #ff6b6b;
        }

        .trade-item-card.receiving {
            border-left-color: #51cf66;
        }

        .trade-item-info {
            flex: 1;
        }

        .trade-item-name {
            font-weight: bold;
            color: #333;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .trade-item-value {
            font-size: 12px;
            color: #666;
        }

        .trade-item-total {
            font-weight: bold;
            color: #667eea;
            font-size: 14px;
            min-width: 80px;
            text-align: right;
        }

        .remove-item-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            transition: background 0.3s;
        }

        .remove-item-btn:hover {
            background: #ff5252;
        }

        .trade-summary {
            background: white;
            border: 2px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .trade-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .trade-summary-row:last-child {
            border-bottom: none;
        }

        .trade-summary-label {
            color: #666;
            font-weight: bold;
        }

        .trade-summary-value {
            color: #667eea;
            font-weight: bold;
        }

        .trade-verdict {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            text-align: center;
        }

        .trade-verdict.fair {
            background: #e7f5ff;
            color: #1971c2;
            border: 2px solid #74c0fc;
        }

        .trade-verdict.profitable {
            background: #f0fdf4;
            color: #22863a;
            border: 2px solid #34d399;
        }

        .trade-verdict.loss {
            background: #fef2f2;
            color: #b42318;
            border: 2px solid #fca5a5;
        }

        .trade-verdict-text {
            margin-bottom: 5px;
        }

        .trade-verdict-detail {
            font-size: 13px;
            font-weight: normal;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            .trading-container {
                grid-template-columns: 1fr;
            }

            .tabs {
                flex-wrap: wrap;
            }

            .tab-button {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⛏️ Minecraft Item Value Calculator</h1>
            <p>Calculate the total value of your items in emeralds</p>
        </div>

        <div class="content">
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('calculator')">🧮 Item Calculator</button>
                <button class="tab-button" onclick="switchTab('trading')">🤝 Trade Analyzer</button>
            </div>

            <!-- Calculator Tab -->
            <div id="calculator" class="tab-content active">
                <div class="search-section">
                    <h3 style="margin-bottom: 15px;">Search for an Item</h3>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search items (e.g., 'diamond', 'iron ingot')...">
                        <button onclick="searchItem()">Search</button>
                    </div>
                    <div class="suggestions" id="suggestions"></div>
                </div>

                <div class="calculator-section">
                    <div class="error" id="errorMsg"></div>

                    <div class="input-group">
                        <div class="input-field" style="flex: 2;">
                            <label for="itemSelect">Selected Item:</label>
                            <input type="text" id="itemSelect" placeholder="Item name" readonly>
                        </div>
                        <div class="input-field">
                            <label for="priceInput">Price per Item:</label>
                            <input type="number" id="priceInput" placeholder="0" readonly>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="input-field" style="flex: 1; min-width: 150px;">
                            <label for="stackInput">Stacks:</label>
                            <input type="number" id="stackInput" placeholder="0" value="0" min="0">
                        </div>
                        <div class="input-field" style="flex: 1; min-width: 150px;">
                            <label for="individualInput">Individual:</label>
                            <input type="number" id="individualInput" placeholder="0" value="0" min="0" max="63">
                        </div>
                        <button class="calc-button" onclick="calculateValue()">Calculate Value</button>
                    </div>
                </div>

                <div class="results" id="results">
                    <div class="result-row">
                        <span class="result-label">Item:</span>
                        <span class="result-value" id="resultItem">-</span>
                    </div>
                    <div class="result-row">
                        <span class="result-label">Unit Price:</span>
                        <span class="result-value" id="resultUnitPrice">-</span>
                    </div>
                    <div class="result-row">
                        <span class="result-label">Quantity:</span>
                        <span class="result-value" id="resultQuantity">-</span>
                    </div>
                    <div class="total-row">
                        <span class="total-label">Total Value:</span>
                        <span class="total-value" id="resultTotal">-</span>
                    </div>
                </div>
            </div>

            <!-- Trading Tab -->
            <div id="trading" class="tab-content">
                <div class="trading-container">
                    <!-- Offering Side -->
                    <div class="trade-side offering">
                        <h3>📤 Offering (Giving Away)</h3>
                        <div class="search-box">
                            <input type="text" id="offeringSearch" placeholder="Search items...">
                            <button onclick="searchOfferingItem()">Search</button>
                        </div>
                        <div class="suggestions" id="offeringSuggestions"></div>
                        
                        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <div class="trade-item-input" style="flex: 1; min-width: 120px;">
                                <label>Stacks:</label>
                                <input type="number" id="offeringStacks" placeholder="0" value="0" min="0">
                            </div>
                            <div class="trade-item-input" style="flex: 1; min-width: 120px;">
                                <label>Individual:</label>
                                <input type="number" id="offeringIndividual" placeholder="0" value="0" min="0" max="63">
                            </div>
                            <button class="add-item-btn" onclick="addOfferingItem()" style="align-self: flex-end; margin-top: 20px;">+ Add Item</button>
                        </div>

                        <div id="offeringList" class="trade-items" style="margin-top: 20px;"></div>
                        
                        <div class="trade-summary">
                            <div class="trade-summary-row">
                                <span class="trade-summary-label">Total Offering Value:</span>
                                <span class="trade-summary-value" id="offeringTotal">0 💚</span>
                            </div>
                        </div>
                    </div>

                    <!-- Receiving Side -->
                    <div class="trade-side receiving">
                        <h3>📥 Receiving (Getting)</h3>
                        <div class="search-box">
                            <input type="text" id="receivingSearch" placeholder="Search items...">
                            <button onclick="searchReceivingItem()">Search</button>
                        </div>
                        <div class="suggestions" id="receivingSuggestions"></div>
                        
                        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                            <div class="trade-item-input" style="flex: 1; min-width: 120px;">
                                <label>Stacks:</label>
                                <input type="number" id="receivingStacks" placeholder="0" value="0" min="0">
                            </div>
                            <div class="trade-item-input" style="flex: 1; min-width: 120px;">
                                <label>Individual:</label>
                                <input type="number" id="receivingIndividual" placeholder="0" value="0" min="0" max="63">
                            </div>
                            <button class="add-item-btn" onclick="addReceivingItem()" style="align-self: flex-end; margin-top: 20px;">+ Add Item</button>
                        </div>

                        <div id="receivingList" class="trade-items" style="margin-top: 20px;"></div>
                        
                        <div class="trade-summary">
                            <div class="trade-summary-row">
                                <span class="trade-summary-label">Total Receiving Value:</span>
                                <span class="trade-summary-value" id="receivingTotal">0 💚</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="trade-verdict" id="verdict" style="display: none;">
                    <div class="trade-verdict-text" id="verdictText"></div>
                    <div class="trade-verdict-detail" id="verdictDetail"></div>
                </div>
            </div>
        </div>
    </div>

        function searchItem() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const suggestionsDiv = document.getElementById('suggestions');
            const errorMsg = document.getElementById('errorMsg');

            if (!query) {
                suggestionsDiv.innerHTML = '';
                errorMsg.classList.remove('show');
                return;
            }

            const matches = Object.keys(itemDatabase).filter(item =>
                item.includes(query)
            ).slice(0, 15);

            if (matches.length === 0) {
                suggestionsDiv.innerHTML = '<div style="width: 100%; padding: 10px; text-align: center; color: #999;">No items found</div>';
                errorMsg.classList.remove('show');
            } else {
                suggestionsDiv.innerHTML = matches.map(item =>
                    `<div class="suggestion-item" onclick="selectItem('${item}')">${item}</div>`
                ).join('');
                errorMsg.classList.remove('show');
            }
        }

        function selectItem(item) {
            selectedItem = item;
            const prices = itemDatabase[item];
            selectedStackPrice = prices[1];
            selectedIndividualPrice = prices[0];
            
            document.getElementById('itemSelect').value = item.charAt(0).toUpperCase() + item.slice(1);
            document.getElementById('priceInput').value = selectedIndividualPrice + ' (individual) / ' + selectedStackPrice + ' (stack)';
            document.getElementById('searchInput').value = '';
            document.getElementById('suggestions').innerHTML = '';
            document.getElementById('stackInput').value = '0';
            document.getElementById('individualInput').value = '0';
        }

        function calculateValue() {
            const errorMsg = document.getElementById('errorMsg');
            const resultsDiv = document.getElementById('results');
            
            if (!selectedItem) {
                errorMsg.textContent = '❌ Please select an item first';
                errorMsg.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            const stacks = parseInt(document.getElementById('stackInput').value) || 0;
            const individuals = parseInt(document.getElementById('individualInput').value) || 0;
            
            if (stacks < 0 || individuals < 0 || individuals > 63) {
                errorMsg.textContent = '❌ Please enter valid quantities (0-63 for individual items)';
                errorMsg.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            if (stacks === 0 && individuals === 0) {
                errorMsg.textContent = '❌ Please enter at least one item';
                errorMsg.classList.add('show');
                resultsDiv.classList.remove('show');
                return;
            }

            errorMsg.classList.remove('show');
            
            const total = (stacks * selectedStackPrice) + (individuals * selectedIndividualPrice);
            const totalItems = (stacks * 64) + individuals;

            document.getElementById('resultItem').textContent = selectedItem.charAt(0).toUpperCase() + selectedItem.slice(1);
            document.getElementById('resultUnitPrice').textContent = selectedIndividualPrice.toLocaleString() + ' 💚 (each) / ' + selectedStackPrice.toLocaleString() + ' 💚 (stack)';
            document.getElementById('resultQuantity').textContent = stacks + ' stacks + ' + individuals + ' = ' + totalItems + ' total items';
            document.getElementById('resultTotal').textContent = total.toLocaleString() + ' 💚';

            resultsDiv.classList.add('show');
        }

            const verdictDiv = document.getElementById('verdict');

                return;
            }

            verdictDiv.style.display = 'block';
            
            const difference = receivingTotal - offeringTotal;
            const percentDiff = ((difference / offeringTotal) * 100).toFixed(1);

            verdictDiv.className = 'trade-verdict';
            
            if (Math.abs(difference) <= offeringTotal * 0.05) {
                verdictDiv.classList.add('fair');
                verdictText.textContent = '✅ Fair Trade';
                verdictDetail.textContent = `Both sides are nearly equal (±5% difference)`;
            } else if (difference > 0) {
                verdictDiv.classList.add('profitable');
                verdictText.textContent = '💰 Profitable Trade';
                verdictDetail.textContent = `You gain ${difference.toLocaleString()} 💚 value (+${percentDiff}%)`;
            } else {
                verdictDiv.classList.add('loss');
                verdictText.textContent = '⚠️ Trade Loss';
                verdictDetail.textContent = `You lose ${Math.abs(difference).toLocaleString()} 💚 value (${percentDiff}%)`;
            }
        }

        // Allow Enter key to search
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (e.target === document.getElementById('searchInput')) searchItem();
                if (e.target === document.getElementById('offeringSearch')) searchOfferingItem();
                if (e.target === document.getElementById('receivingSearch')) searchReceivingItem();
            }
        });
    </script>
</body>
</html>
